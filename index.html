<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lobos Training Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Navy, sky blue, silver, white */
  --paper:#EEF2F7;--surface:#FFFFFF;--ink:#0B1B3A;--muted:#5C6878;--line:#C9D1DC;
  --brand:#0B2545;--brand-ink:#FFFFFF;--go:#1A7FBF;--go-soft:#E0F0FA;--streak:#1A7FBF;--soft:#E3E8EF;--danger:#B3372E;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#06142B;--surface:#0E2140;--ink:#EEF3F9;--muted:#A9B4C4;--line:#24395C;
  --brand:#7CC4F0;--brand-ink:#06142B;--go:#7CC4F0;--go-soft:#12304F;--streak:#9ED3F5;--soft:#16294A;--danger:#F08A80;}}
:root[data-theme="dark"]{
  --paper:#06142B;--surface:#0E2140;--ink:#EEF3F9;--muted:#A9B4C4;--line:#24395C;
  --brand:#7CC4F0;--brand-ink:#06142B;--go:#7CC4F0;--go-soft:#12304F;--streak:#9ED3F5;--soft:#16294A;--danger:#F08A80;}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);font-size:17px;line-height:1.45}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,"Arial Narrow",sans-serif;font-weight:700;line-height:1.1;margin:0;letter-spacing:.01em}
h2{font-size:1.6rem}h3{font-size:1.25rem}
p{margin:.35rem 0}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
main{max-width:640px;margin:0 auto;padding:16px 16px 110px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.top h1{font-size:1.35rem}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.link{background:none;border:0;color:var(--brand);font-weight:600;padding:8px 4px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tabs button{background:none;border:0;padding:14px 4px;font-weight:600;color:var(--muted);border-top:3px solid transparent}
.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--brand)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;padding:11px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.go{background:var(--go);color:#fff}
.btn.small{padding:7px 12px;font-size:.92rem}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
label{display:block;font-weight:600;font-size:.92rem;margin:12px 0 4px}
input,select,textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.err{color:var(--danger);font-weight:600;min-height:1.4em}
/* login */
.login{max-width:420px;margin:0 auto;padding:48px 20px 40px}
.wordmark{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:3.2rem;line-height:.95;margin:0 0 10px}
.wordmark span{display:block;color:var(--muted);font-size:1.6rem;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin:22px 0 4px}
.seg button{border:0;background:var(--surface);padding:11px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.hint{margin-top:22px;padding:12px 14px;border-radius:10px;background:var(--soft);font-size:.92rem}
/* player hero: the scoreboard */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:8px 0 4px}
.big{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:6.5rem;line-height:.85;color:var(--streak);font-variant-numeric:tabular-nums}
.hero h2{font-size:1.9rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0 6px}
.day{text-align:center;font-size:.8rem;color:var(--muted)}
.day i{display:block;height:10px;border-radius:5px;background:var(--line);margin-bottom:4px}
.day.on i{background:var(--streak)}
.day.today{color:var(--ink);font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.bar b{display:block;height:100%;background:var(--go);transition:width .3s}
.drill{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.drill.done{background:var(--go-soft);border-color:var(--go)}
.target{font-weight:600}
.tick{min-width:84px}
.lb{display:grid;grid-template-columns:2rem 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lb:last-child{border-bottom:0}
.lb .pos{font-family:"Barlow Condensed",sans-serif;font-size:1.4rem;font-weight:700;color:var(--muted)}
.lb.me{font-weight:600}
.lb.me .pos{color:var(--brand)}
.pts{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.badge{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center}
.medal{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;background:var(--soft);filter:grayscale(1);opacity:.5}
.badge.got .medal{background:var(--go-soft);filter:none;opacity:1}
/* plans */
.plan{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;margin:10px 0}
.plan h3{margin-bottom:4px}
.meta{color:var(--muted);font-size:.9rem}
.detail h2{font-size:2rem;margin:8px 0 4px}
.detail h3{margin:20px 0 6px;padding-top:14px;border-top:1px solid var(--line)}
.detail ul{padding-left:1.2rem;margin:.3rem 0}
.detail li{margin:.25rem 0}
.phase{white-space:pre-line}
.squad{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.squad:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line);display:inline-block}
.dot.on{background:var(--go)}
.fig{margin:14px 0 6px}
.dg{display:block;width:100%;height:auto;border-radius:10px}
.fig figcaption{font-size:.92rem;color:var(--muted);margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend svg{width:18px;height:12px}
ol.kp{padding-left:0;list-style:none;counter-reset:kp;margin:.3rem 0}
ol.kp li{counter-increment:kp;display:grid;grid-template-columns:24px 1fr;gap:8px;margin:.4rem 0}
ol.kp li::before{content:counter(kp);width:22px;height:22px;border-radius:50%;background:#FFD23F;color:#172036;font-weight:700;font-size:.8rem;display:grid;place-items:center;border:1px solid #172036}
.bands{display:flex;gap:16px;flex-wrap:wrap}
.bands label{display:flex;align-items:center;gap:6px;font-weight:500;margin:4px 0}
.bands input{width:auto}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:10px;font-weight:600;z-index:9;max-width:90vw;text-align:center}

/* ===== Live screens ===== */
.login.wide{max-width:640px}
.privacy h3{margin-top:0}.privacy p{font-size:.92rem;margin:.5em 0}
.check{display:flex;gap:10px;align-items:flex-start;margin:14px 0 4px;font-weight:500}
.check input{width:auto;margin-top:4px}
.pending h2{margin-top:0}
.pendq{border-left:4px solid var(--go)}
.pend{display:grid;grid-template-columns:1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.pend:first-of-type{border-top:0}
@media (min-width:720px){.pend{grid-template-columns:1.2fr 1fr auto;align-items:center}}
.kidsrow{padding-top:0;padding-bottom:10px}.kids{margin:0}
#joinlink{flex:1;min-width:0;font-size:.85rem}
details.card summary{cursor:pointer}
.btn.oauth{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);margin-bottom:10px}
.or{display:flex;align-items:center;gap:10px;margin:8px 0 2px;color:var(--muted);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.printhead{display:none}
.plist{display:grid;gap:10px}
@media (min-width:720px){.plist{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}}
.pcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--ink);font:inherit;cursor:pointer}
.pcard:hover{border-color:var(--go)}
.pcard .ptitle{display:block;font-weight:600;margin:6px 0 2px}
.pill{font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.done{background:var(--go-soft);color:var(--go)}
.pill.late{color:var(--danger)}
.viewonly{background:var(--soft);border-radius:10px;padding:8px 12px}
.pitem{display:grid;grid-template-columns:auto 1fr 64px auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pitem:first-of-type{border-top:0}
.pitem .pit{font-weight:600}
.pitem input{width:64px;padding:6px 8px;margin:0}
.pitem .pbtns{grid-column:1/-1;display:flex;gap:16px;justify-content:flex-end;font-size:.85rem}
.pitem .pbtns button[disabled]{opacity:.35}
.pnum{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-size:.8rem;font-weight:700;margin-right:8px;vertical-align:middle}
.picker{max-height:460px;overflow:auto;margin-top:8px}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;color:var(--ink);font:inherit;cursor:pointer}
.pick .plus{font-size:1.5rem;color:var(--go);font-weight:700;padding:0 6px}
.pex{margin-top:20px;padding-top:6px;border-top:1px solid var(--line)}
.pex figure,.pex .fig{max-width:520px}
.pnote p{margin:.3em 0 0}
.wrapbtns{flex-wrap:wrap;gap:8px;margin:12px 0}
.danger{color:var(--danger)!important}
@media (max-width:440px){.tabs button{font-size:.8rem;padding-left:2px;padding-right:2px}}
@media print{
  :root:root:root{--paper:#fff;--surface:#fff;--ink:#000;--muted:#444;--line:#bbb;--soft:#eee;--brand:#0B2545;--brand-ink:#fff;--go:#1A7FBF;--go-soft:#E0F0FA}
  body{background:#fff!important;color:#000!important;font-size:11pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .top,.tabs,.noprint,.toast,.viewonly{display:none!important}
  main{max-width:none!important;padding:0!important;margin:0!important}
  .printhead{display:block;color:#444;margin:0}
  .pex{break-inside:avoid;page-break-inside:avoid}
  .pex figure,.pex .fig{max-width:3.4in;margin:6px 0}
  .pex h3{margin:6px 0 2px}.pex p{margin:2px 0}
  .card{border:1px solid #bbb;box-shadow:none}
  a{color:#000;text-decoration:none}
}
/* ===== Responsive layouts ===== */
.srctag{display:inline-block;margin-top:6px;font-size:.78rem;font-weight:600;color:var(--brand);background:var(--go-soft);border-radius:999px;padding:2px 9px}
.bankh{margin-top:26px}
.mhide{display:none}
.split,.dsplit,.tsplit,.lbgrid{display:block}
@media (min-width:720px){
  .wrap,main{max-width:900px}
  #planlist,.badges,.tdrills,.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;align-items:start}
  #planlist .plan,.badges .card,.tdrills .card,.bank .card{margin:0;height:100%}
  #planlist>p{grid-column:1/-1}
  /* mouse users can't swipe: wrap every chip row instead of side-scrolling */
  .chips{flex-wrap:wrap;overflow:visible}
}
@media (min-width:1000px){
  body{font-size:16.5px}
  .wrap,main{max-width:1220px;padding-left:28px;padding-right:28px}
  main{padding-top:24px;padding-bottom:48px}
  .top{position:static}
  .top h1{font-size:1.6rem}
  .tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding-bottom:0}
  .tabs .wrap{grid-auto-columns:max-content;gap:6px}
  .tabs button{padding:14px 18px;border-top:0;border-bottom:3px solid transparent}
  .tabs button[aria-current="page"]{border-bottom-color:var(--brand)}
  .toast{bottom:28px}
  .chips.wrapdesk{flex-wrap:wrap;overflow:visible}
  .mhide{display:block}.dhide{display:none}
  /* plans: filter sidebar + grid */
  .plansgrid{display:grid;grid-template-columns:270px 1fr;gap:32px;align-items:start}
  .plansgrid .filters{position:sticky;top:72px}
  /* plan detail: words left, pictures right */
  .dsplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);column-gap:40px;align-items:start}
  .dsplit .dtext1{grid-column:1;grid-row:1}
  .dsplit .dtext2{grid-column:1;grid-row:2}
  .dsplit .dvis{grid-column:2;grid-row:1/span 2;position:sticky;top:72px}
  .dvis>.fig:first-child{margin-top:20px}
  .detail .meta{max-width:70ch}
  /* player today: scoreboard left, drills right */
  .tsplit{display:grid;grid-template-columns:340px 1fr;gap:36px;align-items:start}
  .tsplit .tstat{position:sticky;top:72px}
  /* two-panel coach screens */
  .split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px;align-items:start}
  .split>section>h3:first-child{margin-top:10px}
  .split .bankh{margin-top:0}
  .lbgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start}
  .lbgrid>section>h3{margin:10px 0 4px}
  .bank{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== Data layer =====
   Demo mode keeps everything in this browser (localStorage).
   For the real club version, swap load()/save() and the write helpers
   for Supabase calls (see lobos-schema.sql). */
const KEY='lobos-lab-v2';
const THEMES=['Passing','Receiving','Dribbling & 1v1','Shooting','Possession','Build-up','Crossing','Defending','Transition','Set pieces','Goalkeeping','Agility & coordination'];
const BANDS=['5-8','9-12','13-17'];
const bandLabel=b=>b.replace('-','\u2013');
const bandsText=p=>'Ages '+(p.bands||[]).map(bandLabel).join(', ');
const BOOTROOM='https://www.thefa.com/bootroom';
const SOURCES=['The FA','US Soccer','CONMEBOL','Lobos staff'];
const SRC_LONG={'The FA':'The FA Boot Room','US Soccer':'US Soccer Grassroots (Play-Practice-Play)','CONMEBOL':'CONMEBOL Evoluci\u00f3n youth manual','Lobos staff':'Lobos staff'};
const srcOf=p=>p.src||'Lobos staff';
const PLAN_SEED_V=2;
let S;
let ui={view:null,child:null,linkSent:null,q:'',theme:'All',band:'All',src:'All',plan:null,edit:null,team:null,loginRole:'player',loginTeam:null,addingDrill:false};

function uid(){return Math.random().toString(36).slice(2,10)}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return ymd(new Date())}
function addDays(s,n){const [y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d+n))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}


function seed(){

  const drills=[
    {id:'toe',name:'Toe taps',how:'Tap the top of the ball with alternate soles. Stay light on your toes, eyes up when you can.',target:'3 x 60 seconds'},
    {id:'rolls',name:'Sole rolls',how:'Roll the ball side to side under your sole, across your body. Switch feet.',target:'50 each foot'},
    {id:'inout',name:'Inside-outside touches',how:'Push the ball out with the outside of your foot, bring it back with the inside. Small touches.',target:'50 each foot'},
    {id:'vpull',name:'V pull-backs',how:'Pull the ball back with your sole, then push it forward with the inside of the same foot to make a V.',target:'20 each foot'},
    {id:'wall',name:'Wall passes',how:'Stand 5 yards from a wall. Control with one foot, pass with the other. Keep it on the ground.',target:'50 each foot'},
    {id:'touch',name:'First touch off the wall',how:'Pass hard at the wall and take your first touch out of your feet, to the side, ready for the next pass.',target:'40, switch feet halfway'},
    {id:'jug',name:'Juggling',how:'Keep it up with feet, thighs, and both feet. Count your best run and try to beat it.',target:'10 minutes, beat your record'},
    {id:'cone',name:'Cone weave dribble',how:'Set 6 cones (or shoes) a yard apart. Weave through using both feet, close control.',target:'5 runs each foot'},
    {id:'turns',name:'Turns: Cruyff and drag-back',how:'Dribble, turn, explode away. Do each turn with both feet.',target:'10 of each turn per foot'},
    {id:'strike',name:'Target strikes',how:'Mark a target on a wall. Strike from 10 to 15 yards with laces, both feet.',target:'20 strikes'},
    {id:'feet',name:'Quick feet (no ball)',how:'Ladder or chalk lines: one foot in each, two feet in each, side shuffle in and out.',target:'5 patterns x 3'}
  ];
  const plans=[
    {title:'Passing through gates into a target player',theme:'Passing',bands:['9-12'],mins:30,
     objective:'Play forward passes with the right weight, and receive half-turned so the next pass is quicker.',
     setup:'30x20 yd area with 6 to 8 small cone gates, a ball per pair. A second area 30x15 split into three zones.',
     warmup:'Pairs pass through as many gates as possible in 60 seconds. Change the rule each round: two-touch, then one-touch, then weaker foot only.',
     main:'Three zones in a line. Two players in each end zone, one target player in the middle. End players pass into the middle player, who receives on the half-turn and plays to the other end. Add a defender in the middle zone after 5 minutes.',
     game:'5v5. A goal only counts if the team completed 4 passes in that move.',
     points:['Check your shoulder before the ball arrives','Open your body so you can see forward','Receive on the back foot, away from pressure','Pass to the far foot of your teammate','Lock the ankle and follow through to the target'],
     progress:'Easier: no defender, two touches allowed. Harder: one-touch in the middle zone, or a second defender.',
     dg:[{cap:'Main practice: end player passes into the middle, who turns and plays to the far end.',f:'grid',items:[['z',6,6,28,58],['z',36,6,28,58],['z',66,6,28,58],['A',16,22],['A',16,48],['N',50,35],['D',50,18],['A',84,22],['A',84,48],['p',16,22,50,35],['p',50,35,84,48],['n',57,28,1],['n',50,45,3],['n',30,22,5]]}]},

    {title:'Finishing from lay-offs',theme:'Shooting',bands:['9-12','13-17'],mins:30,
     objective:'Shoot early and accurately from inside and around the box, with both feet.',
     setup:'Half pitch, goal with GK, balls at the top of the box, cones marking shooting lines.',
     warmup:'Pairs strike at small cone goals from 12 yards. Inside of the foot for accuracy first, then laces.',
     main:'Server at the edge of the box. Shooter passes in, gets a lay-off, and finishes first time or with one setting touch. Shooter becomes server. After a few rounds add a recovering defender from behind.',
     game:'4v4 plus GKs on a short pitch. Goals from outside a marked zone count double.',

function streak(pid){const s=dayset(pid);let d=today();if(!s.has(d))d=addDays(d,-1);let n=0;while(s.has(d)){n++;d=addDays(d,-1)}return n}
function bestStreak(pid){const arr=[...(S.days[pid]||[])].sort();let best=0,run=0,prev=null;for(const d of arr){run=(prev&&addDays(prev,1)===d)?run+1:1;best=Math.max(best,run);prev=d}return best}
function points(pid,sinceDays){const from=sinceDays?addDays(today(),-(sinceDays-1)):'0000';
  return S.logs.filter(l=>l.p===pid&&l.date>=from).length*10+(S.days[pid]||[]).filter(d=>d>=from).length*20}
const BADGES=[
  {icon:'⚽',name:'First session',desc:'Finish all your reps for one day',test:p=>(S.days[p]||[]).length>=1},
  {icon:'🎩',name:'Hat trick',desc:'3-day streak',test:p=>bestStreak(p)>=3},
  {icon:'📅',name:'Full week',desc:'7-day streak',test:p=>bestStreak(p)>=7},
  {icon:'🐺',name:'Lone wolf',desc:'14-day streak',test:p=>bestStreak(p)>=14},
  {icon:'🏆',name:'Month of touches',desc:'30-day streak',test:p=>bestStreak(p)>=30},
  {icon:'💯',name:'500 club',desc:'Earn 500 points',test:p=>points(p)>=500},
  {icon:'🔥',name:'25 sessions',desc:'Finish 25 days of reps',test:p=>(S.days[p]||[]).length>=25}

function todayView(){

  const hw=S.homework[p.team]||[];

    return `<div class="day ${ds.has(d)?'on':''} ${d===T?'today':''}"><i></i>${letters[wd]}</div>`}).join('');
  return `<div class="tsplit"><section class="tstat"><section class="hero" aria-label="Streak"><div class="big">${st}</div><div><h2>day streak</h2><p class="muted">${msg}</p></div></section>

    <div class="tdrills">${hw.map(h=>{const d=drill(h.d);if(!d)return'';const ok=done.has(h.d);

/* --- Diagrams --- */
const DCOL={A:'#1F4E8C',D:'#E2731F',N:'#FFFFFF',K:'#8E44AD'};
let dgN=0;
function dgArrow(k,a,id){
  let [x1,y1,x2,y2]=a;const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;
  if(len>10){x1+=ux*2.6;y1+=uy*2.6;x2-=ux*2.6;y2-=uy*2.6}
  const st=`stroke="#fff" stroke-width=".6" fill="none" marker-end="url(#${id})"`;
  if(k==='p')return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${st}/>`;
  if(k==='r')return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${st} stroke-dasharray="1.6 1.2"/>`;
  const L=Math.hypot(x2-x1,y2-y1),n=Math.max(4,Math.floor(L/1.2)),px=-uy,py=ux;let d=`M${x1.toFixed(1)},${y1.toFixed(1)}`;
  for(let i=1;i<=n;i++){const t=i/n,amp=i>n-3?0:.9*Math.sin(t*L/2.4*Math.PI);d+=` L${(x1+(x2-x1)*t+px*amp).toFixed(1)},${(y1+(y2-y1)*t+py*amp).toFixed(1)}`}
  return `<path d="${d}" ${st}/>`;
}
function dgText(x,y,t,anchor='middle'){return `<text x="${x}" y="${y}" font-size="2.8" fill="#fff" text-anchor="${anchor}" font-family="Barlow,sans-serif" font-weight="600">${esc(t)}</text>`}
function svgDiagram(dg){
  const h=dg.h||70,id='ah'+(dgN++),o=[],ar=[],top=[],mk=[],used=new Set();
  o.push(`<rect width="100" height="${h}" fill="#3B8857"/>`);
  for(let y=10;y<h;y+=20)o.push(`<rect y="${y}" width="100" height="10" fill="#42915F"/>`);
  const ln='fill="none" stroke="#fff" stroke-width=".5" stroke-opacity=".9"';
  if(dg.f==='grid')o.push(`<rect x="4" y="4" width="92" height="${h-8}" ${ln} stroke-dasharray="2 1.5"/>`);
  if(dg.f==='goal')o.push(`<path d="M4,${h} V4 H96 V${h}" ${ln}/>`,`<rect x="22" y="4" width="56" height="24" ${ln}/>`,`<rect x="38" y="4" width="24" height="8" ${ln}/>`,`<rect x="44" y="1" width="12" height="3" ${ln} stroke-width=".8"/>`,`<circle cx="50" cy="20" r=".7" fill="#fff"/>`,`<path d="M44,28 A10,10 0 0,0 56,28" ${ln}/>`);
  for(const it of dg.items){const [k,...a]=it;
    if(k==='z'){o.push(`<rect x="${a[0]}" y="${a[1]}" width="${a[2]}" height="${a[3]}" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".6" stroke-width=".4" stroke-dasharray="1.5 1"/>`);if(a[4])o.push(dgText(a[0]+1.5,a[1]+4,a[4],'start'))}
    else if(k==='l')o.push(`<line x1="${a[0]}" y1="${a[1]}" x2="${a[2]}" y2="${a[3]}" stroke="#fff" stroke-width="${a[4]||.5}"/>`);
    else if(k==='g'){const w=a[2]||10;o.push(`<rect x="${a[0]-w/2}" y="${a[1]-1}" width="${w}" height="2" fill="#fff" fill-opacity=".3" stroke="#fff" stroke-width=".6"/>`)}
    else if(k==='c'){o.push(`<path d="M${a[0]},${a[1]-1.7} L${a[0]+1.5},${a[1]+1.1} L${a[0]-1.5},${a[1]+1.1}Z" fill="#FFD23F" stroke="#172036" stroke-width=".25"/>`);used.add('c')}
    else if(k==='p'||k==='r'||k==='d'){ar.push(dgArrow(k,a,id));used.add(k)}
    else if(DCOL[k]){const dark=k==='N';top.push(`<circle cx="${a[0]}" cy="${a[1]}" r="2.6" fill="${DCOL[k]}" stroke="${dark?'#172036':'#fff'}" stroke-width=".5"/>`+(a[2]?`<text x="${a[0]}" y="${a[1]+.95}" font-size="2.6" text-anchor="middle" fill="${dark?'#172036':'#fff'}" font-family="Barlow,sans-serif" font-weight="700">${esc(a[2])}</text>`:''));used.add(k)}
    else if(k==='b')top.push(`<circle cx="${a[0]}" cy="${a[1]}" r="1.1" fill="#fff" stroke="#172036" stroke-width=".4"/>`);
    else if(k==='n'){mk.push(`<circle cx="${a[0]}" cy="${a[1]}" r="2.3" fill="#FFD23F" stroke="#172036" stroke-width=".4"/><text x="${a[0]}" y="${a[1]+1}" font-size="2.8" text-anchor="middle" fill="#172036" font-family="Barlow,sans-serif" font-weight="700">${a[2]}</text>`);used.add('n')}
    else if(k==='t')o.push(dgText(a[0],a[1],a[2],a[3]));
  }
  const svg=`<svg class="dg" viewBox="0 0 100 ${h}" role="img" aria-label="${esc(dg.cap||'Practice diagram')}"><defs><marker id="${id}" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#fff"/></marker></defs>${o.join('')}${ar.join('')}${top.join('')}${mk.join('')}</svg>`;
  const dot=c=>`<svg viewBox="0 0 18 12"><circle cx="9" cy="6" r="4.5" fill="${c}" stroke="#172036" stroke-width="1"/></svg>`;
  const lineIc=da=>`<svg viewBox="0 0 18 12"><line x1="1" y1="6" x2="17" y2="6" stroke="currentColor" stroke-width="1.6" ${da?'stroke-dasharray="3 2.5"':''}/></svg>`;
  const L={A:[dot(DCOL.A),'Focus team'],D:[dot(DCOL.D),'Opponents'],N:[dot('#fff'),'Server or neutral'],K:[dot(DCOL.K),'Goalkeeper'],c:[`<svg viewBox="0 0 18 12"><path d="M9,1 L14,11 L4,11Z" fill="#FFD23F" stroke="#172036"/></svg>`,'Cone'],
    p:[lineIc(0),'Pass or shot'],r:[lineIc(1),'Run'],d:[`<svg viewBox="0 0 18 12"><path d="M1,6 Q3.5,2 6,6 T11,6 T16,6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`,'Dribble'],n:[dot('#FFD23F'),'Coaching point']};
  const leg=['A','D','N','K','c','p','r','d','n'].filter(k=>used.has(k)).map(k=>`<span>${L[k][0]}${L[k][1]}</span>`).join('');
  return `<figure class="fig">${svg}<figcaption>${esc(dg.cap||'')}</figcaption><div class="legend">${leg}</div></figure>`;
}

async function all(build){let out=[],from=0;for(;;){const {data,error}=await build().range(from,from+999);if(error)throw error;out=out.concat(data||[]);if(!data||data.length<1000)break;from+=1000}return out}
function chk(r){if(r&&r.error)throw r.error;return r?r.data:null}
function friendly(e){const m=String((e&&(e.message||e.error_description))||e||'');
  if(/rate limit|too many|429/i.test(m))return 'Too many sign-in emails were sent recently. Wait a few minutes and try again.';
  if(/fetch|network|load failed/i.test(m))return 'Can\u2019t reach the club database. Check your connection and try again.';
  if(/not authorized|permission|row-level|violates/i.test(m))return 'You don\u2019t have permission to do that.';
  if(/only an approver/i.test(m))return 'Only the head approver can approve or remove players.';
  return m||'Something went wrong. Please try again.'}
const mapPlayer=r=>({id:r.id,team:r.team_id,req:r.requested_team_id||r.team_id,name:r.display_name,status:r.status});
const mapDrill=r=>({id:r.id,name:r.name,how:r.how||'',target:r.default_target||'',video:r.video_url||''});
function mapPlan(r){const c=S.coaches.find(c=>c.id===r.created_by);return {id:r.id,title:r.title,theme:r.theme,bands:r.age_bands||[],mins:r.minutes||60,objective:r.objective||'',setup:r.setup||'',warmup:r.warmup||'',main:r.main||'',game:r.game||'',points:r.coaching_points||[],progress:r.progressions||'',link:r.link||'',src:r.src||'Lobos staff',ref:r.ref||'',dg:r.diagrams||[],by:c?c.name:'',updated:r.updated_at||''}}
function planRow(p){return {title:p.title,theme:p.theme,age_bands:p.bands||[],minutes:p.mins||60,objective:p.objective,setup:p.setup,warmup:p.warmup,main:p.main,game:p.game,coaching_points:p.points||[],progressions:p.progress,link:p.link||null,src:p.src||'Lobos staff',ref:p.ref||null,diagrams:p.dg||[]}}
function setLogs(rows){S.logs=rows.map(l=>({p:l.player_id,d:l.drill_id,date:l.day}))}
function setDays(rows){S.days={};rows.forEach(r=>(S.days[r.player_id]=S.days[r.player_id]||[]).push(r.day))}

let loadingUid=null;
async function boot(){
  if(!sb){BOOT={state:'error',msg:'The sign-in service didn\u2019t load. Check your connection and refresh the page.'};return render()}
  try{const {data}=await sb.auth.getSession();
    if(data&&data.session)await loadForUser(data.session.user);else{BOOT.state='ready';render()}}
  catch(e){BOOT={state:'error',msg:friendly(e)};render()}
}
if(sb)sb.auth.onAuthStateChange((ev,session)=>{
  if(ev==='SIGNED_IN'&&session&&(!S.session||S.session.uid!==session.user.id))setTimeout(()=>loadForUser(session.user),0);
  if(ev==='SIGNED_OUT'){resetState();BOOT.state='ready';render()}
});
function resetState(){S={teams:[],coaches:[],plans:[],drills:[],homework:{},players:[],pending:[],invites:[],logs:[],days:{},board:[],children:[],guardian:null,session:null,teamCoaches:[],practices:[]};ui={...ui,view:null,plan:null,edit:null,child:null,linkSent:null}}

async function loadForUser(user){
  if(loadingUid===user.id)return;loadingUid=user.id;
  BOOT.state='loading';render();
  try{
    const isCoach=chk(await sb.rpc('claim_coach'));
    const teams=await all(()=>sb.from('teams').select('id,name,code'));
    S.teams=teams.sort((a,b)=>TEAM_ORDER.indexOf(a.id)-TEAM_ORDER.indexOf(b.id));
    S.drills=(await all(()=>sb.from('drills').select('*').order('name'))).map(mapDrill);
    if(isCoach){
      S.coaches=await all(()=>sb.from('coaches').select('id,name,is_approver'));
      const me=S.coaches.find(c=>c.id===user.id)||{name:'Coach',is_approver:false};
      S.session={role:'coach',uid:user.id,name:me.name,approver:!!me.is_approver,email:user.email};
      await loadCoachData();
    }else{
      S.session={role:'guardian',uid:user.id,email:user.email};
      S.guardian=chk(await sb.from('guardians').select('id,consent_at').eq('id',user.id).maybeSingle());
      if(S.guardian)await loadFamily();
    }
    BOOT.state='ready';
  }catch(e){console.error(e);BOOT={state:'error',msg:friendly(e)}}
  loadingUid=null;render();
}
async function loadCoachData(){
  const [plans,hw,players,logs,days,invites,tcs,prs]=await Promise.all([
    all(()=>sb.from('plans').select('*')),
    all(()=>sb.from('homework').select('*').order('position')),
    all(()=>sb.from('players').select('id,team_id,requested_team_id,display_name,status,created_at').order('created_at')),
    all(()=>sb.from('rep_logs').select('player_id,drill_id,day').gte('day',addDays(today(),-35))),
    all(()=>sb.from('complete_days').select('player_id,day')),
    S.session.approver?all(()=>sb.from('coach_invites').select('email,name,is_approver')):Promise.resolve([]),
    all(()=>sb.from('team_coaches').select('team_id,coach_id')).catch(()=>null),
    all(()=>sb.from('practices').select('*').gte('day',addDays(today(),-365)).order('day',{ascending:false})).catch(()=>null)
  ]);
  // If step 3 of the database setup hasn't been run yet, keep working as before.
  S.practicesReady=!!(tcs&&prs);S.teamCoaches=tcs||[];S.practices=(prs||[]).map(mapPractice);
  S.plans=plans.map(mapPlan).sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')||a.title.localeCompare(b.title));
  setHomework(hw);
  const ps=players.map(mapPlayer);
  S.players=ps.filter(p=>p.status==='active');S.pending=ps.filter(p=>p.status==='pending');
  setLogs(logs);setDays(days);S.invites=invites;
}
async function loadFamily(){
  const kids=await all(()=>sb.from('players').select('id,team_id,requested_team_id,display_name,status,created_at').eq('guardian_id',S.session.uid).order('created_at'));
  S.children=kids.map(mapPlayer).filter(c=>c.status!=='removed');
  if(!ui.child||!S.children.some(c=>c.id===ui.child))ui.child=((S.children.find(c=>c.status==='active')||S.children[0])||{}).id||null;
  const active=S.children.filter(c=>c.status==='active');S.players=active;
  const ids=active.map(c=>c.id),teams=[...new Set(active.map(c=>c.team))];
  const [hw,logs,days]=await Promise.all([
    teams.length?all(()=>sb.from('homework').select('*').in('team_id',teams).order('position')):Promise.resolve([]),
    ids.length?all(()=>sb.from('rep_logs').select('player_id,drill_id,day').in('player_id',ids)):Promise.resolve([]),
    ids.length?all(()=>sb.from('complete_days').select('player_id,day').in('player_id',ids)):Promise.resolve([])
  ]);
  setHomework(hw);setLogs(logs);setDays(days);
  await loadBoard();
}
async function loadBoard(){
  const c=S.children.find(c=>c.id===ui.child);
  if(!c||c.status!=='active'){S.board=[];return}
  S.board=chk(await sb.rpc('team_leaderboard',{p_team:c.team}))||[];
}

  if(!S.session){app.innerHTML=loginView();return}
  const coach=S.session.role==='coach';
  if(!coach){if(!S.guardian){app.innerHTML=consentView();return}if(!S.children.length){app.innerHTML=firstChildView();return}}
  const views=coach?{plans:plansView,practices:practicesView,homework:homeworkView,squad:squadView,board:coachBoardView}:{today:todayView,board:boardView,badges:badgesView,family:familyView};

  if(coach&&ui.view==='plans'&&!S.plans.length&&!ui.edit)body=starterView();
  if(!coach&&ui.view!=='family'){const c=S.children.find(c=>c.id===ui.child);if(!c||c.status!=='active')body=pendingView(c)}
  app.innerHTML=header()+nav()+`<main>${body||views[ui.view]()}</main>`;
}
const err=(m,id='err')=>{const e=document.getElementById(id);if(e)e.textContent=m};
const val=id=>(document.getElementById(id)?.value||'').trim();
function cleanName(n){const parts=n.replace(/\s+/g,' ').trim().split(' ');if(parts.length<2)return null;
  const first=parts.slice(0,-1).join(' '),last=parts.at(-1).replace(/\./g,'').charAt(0); // full surname -> initial only
  if(!/^[\p{L}' -]{1,20}$/u.test(first)||!/^\p{L}$/u.test(last))return null;
  return first.charAt(0).toUpperCase()+first.slice(1)+' '+last.toUpperCase()+'.'}

/* ===== Practices and team assignments ===== */
const canEdit=t=>!!S.session&&S.session.role==='coach'&&(!S.practicesReady||S.session.approver||S.teamCoaches.some(a=>a.team_id===t&&a.coach_id===S.session.uid));
const coachName=id=>(S.coaches.find(c=>c.id===id)||{}).name||'';
const fmtDay=d=>{const [y,m,dd]=String(d).split('-').map(Number);return new Date(y,m-1,dd).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})};
const mapPractice=r=>({id:r.id,team:r.team_id,day:r.day,title:r.title||'',notes:r.notes||'',items:Array.isArray(r.items)?r.items:[],status:r.status||'planned',done:r.done_notes||'',by:r.created_by,upd:r.updated_by});
const pMins=p=>p.items.reduce((n,i)=>n+(+i.minutes||0),0);
function editBadge(t){return canEdit(t)?'':`<p class="viewonly small">View only. You\u2019re not assigned to ${esc(team(t).name)}. Ask Jason to add you if you\u2019re covering this team.</p>`}
function teamCoachLine(t){const cs=S.teamCoaches.filter(a=>a.team_id===t).map(a=>coachName(a.coach_id)).filter(Boolean);return `<p class="small muted">Team coaches: ${cs.length?esc(cs.join(', ')):'none assigned yet'}</p>`}
function pillFor(p){const T=today();if(p.status==='done')return '<span class="pill done">Done</span>';return p.day<T?'<span class="pill late">Not marked done</span>':'<span class="pill">Planned</span>'}

function practicesView(){
  if(!S.practicesReady)return `<h2>Practices</h2><div class="card"><h3>One more database step</h3><p>Practices need a small addition to the club database. In Supabase, open the SQL Editor, start a new query, paste in the step 3 file (lobos-schema-3-practices.sql) and click Run once. Then refresh this page.</p></div>`;
  if(ui.pedit&&ui.draft)return practiceEditor();
  if(ui.practice){const p=S.practices.find(x=>x.id===ui.practice);if(p)return practiceDetail(p);ui.practice=null}
  const chips=teamChips();const T=today();const t=ui.team;
  const list=S.practices.filter(p=>p.team===t);
  const up=list.filter(p=>p.day>=T&&p.status!=='done').sort((a,b)=>a.day.localeCompare(b.day));
  const past=list.filter(p=>!(p.day>=T&&p.status!=='done')).sort((a,b)=>b.day.localeCompare(a.day));
  const card=p=>`<button class="pcard" data-act="open-practice" data-id="${p.id}"><span class="row between"><strong>${esc(fmtDay(p.day))}</strong>${pillFor(p)}</span>
    <span class="ptitle">${esc(p.title||p.items.map(i=>i.title).slice(0,2).join(', ')||'Practice')}</span>
    <span class="meta">${p.items.length} exercise${p.items.length===1?'':'s'}, ${pMins(p)} min${p.by?'. Set by '+esc(coachName(p.by)):''}</span></button>`;
  return `<div class="row between"><h2>Practices</h2>${canEdit(t)?'<button class="btn small" data-act="new-practice">New practice</button>':''}</div>
  ${chips}${teamCoachLine(t)}${editBadge(t)}
  <h3>Coming up</h3>${up.length?`<div class="plist">${up.map(card).join('')}</div>`:'<p class="muted small">Nothing planned yet for this team.</p>'}
  <h3>History</h3>${past.length?`<div class="plist">${past.map(card).join('')}</div>`:'<p class="muted small">No past practices logged for this team.</p>'}`;
}

function practiceDetail(p){

    return `<section class="pex"><h3><span class="pnum">${i+1}</span>${esc(pl?pl.title:it.title)} <span class="muted small">${+it.minutes||0} min</span></h3>

    ${(pl.dg||[]).map(svgDiagram).join('')}
    ${pl.points&&pl.points.length?`<p><strong>Coaching points</strong></p><ol class="kp">${pl.points.map(x=>`<li><span>${esc(x)}</span></li>`).join('')}</ol>`:''}
    ${pl.progress?`<p class="small"><strong>Easier or harder.</strong> ${esc(pl.progress)}</p>`:''}

  ${p.notes?`<div class="card pnote"><strong>Notes from the coach</strong><p>${esc(p.notes)}</p></div>`:''}
  ${p.status==='done'&&p.done?`<div class="card pnote"><strong>How it went</strong><p>${esc(p.done)}</p></div>`:''}
  <div class="noprint row wrapbtns">
    <button class="btn small" data-act="print-practice">Print or save as PDF</button>

    ${ed&&p.status!=='done'?`<button class="btn ghost small" data-act="done-open">Mark done</button>`:''}
    ${ed?`<button class="btn ghost small" data-act="copy-practice" data-id="${p.id}">Reuse for another day</button>`:''}
  </div>
  ${ui.doneOpen&&ed?`<div class="card noprint"><label for="done-notes">How did it go? (optional)</label><textarea id="done-notes" placeholder="What worked, what to repeat next time"></textarea>
    <div class="row"><button class="btn small go" data-act="practice-done" data-id="${p.id}">Save as done</button><button class="link" data-act="done-cancel">Cancel</button></div></div>`:''}
  <div class="noprint">${editBadge(p.team)}</div>

function pickList(c){return c.map(p=>`<button class="pick" data-act="pi-add" data-id="${p.id}"><span><strong>${esc(p.title)}</strong><br><span class="small muted">${esc(p.theme)}. ${bandsText(p)}. ${p.mins} min. ${esc(srcOf(p))}</span></span><span class="plus" aria-hidden="true">+</span></button>`).join('')||'<p class="muted small">No sessions match.</p>'}
function pickCands(){const q=(ui.pq||'').toLowerCase().trim();return S.plans.filter(p=>!q||(p.title+' '+p.theme+' '+srcOf(p)+' '+(p.bands||[]).join(' ')).toLowerCase().includes(q))}
function practiceEditor(){
  const d=ui.draft;const total=d.items.reduce((n,i)=>n+(+i.minutes||0),0);
  const items=d.items.map((it,i)=>`<div class="pitem"><span class="pnum">${i+1}</span><span class="pit">${esc(it.title)}</span>

    <span class="pbtns"><button class="link" data-act="pi-up" data-i="${i}" ${i?'':'disabled'} aria-label="Move up">Move up</button><button class="link" data-act="pi-down" data-i="${i}" ${i<d.items.length-1?'':'disabled'} aria-label="Move down">Move down</button><button class="link danger" data-act="pi-remove" data-i="${i}">Remove</button></span></div>`).join('');

   <div class="card">
    <label for="pr-team">Team</label><select id="pr-team">${S.teams.filter(t=>canEdit(t.id)).map(t=>`<option value="${t.id}" ${t.id===d.team?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
    <label for="pr-day">Date</label><input id="pr-day" type="date" value="${esc(d.day)}">
    <label for="pr-title">Focus (optional)</label><input id="pr-title" value="${esc(d.title)}" placeholder="Weak foot and finishing">
    <label for="pr-notes">Notes for whoever runs it (optional)</label><textarea id="pr-notes" placeholder="Anything the covering coach should know">${esc(d.notes)}</textarea>
   </div>
   <div class="card"><div class="row between"><h3 style="margin:0">Exercises</h3><strong>${total} min total</strong></div>
    ${items||'<p class="muted small">Add exercises from the library.</p>'}</div>
   <p class="err" id="err"></p>

  </section><section>
   <div class="card"><h3 style="margin-top:0">Add from the library</h3>

function syncDraft(){const d=ui.draft;if(!d)return;
  const g=id=>document.getElementById(id);
  if(g('pr-team'))d.team=g('pr-team').value;if(g('pr-day'))d.day=g('pr-day').value;
  if(g('pr-title'))d.title=g('pr-title').value.trim();if(g('pr-notes'))d.notes=g('pr-notes').value.trim();
  document.querySelectorAll('[data-change="pi-min"]').forEach(el=>{const it=d.items[+el.dataset.i];if(it)it.minutes=Math.max(0,Math.min(180,parseInt(el.value)||0))})}

function teamCoachesCard(t){
  const on=S.teamCoaches.filter(a=>a.team_id===t);const ap=S.session.approver;
  const off=S.coaches.filter(c=>!on.some(a=>a.coach_id===c.id));
  return `<div class="card"><h3>Coaches on ${esc(team(t).name)}</h3>
    <p class="small muted">Assigned coaches can plan practices and set daily reps for this team. Everyone else can view them.</p>
    ${on.length?on.map(a=>`<div class="squad"><span><strong>${esc(coachName(a.coach_id))}</strong></span><span></span>${ap?`<button class="link" data-act="unassign-coach" data-id="${a.coach_id}">Remove</button>`:'<span></span>'}</div>`).join(''):'<p class="muted small">No coaches assigned yet.</p>'}
    ${ap&&off.length?`<div class="row" style="margin-top:10px"><select id="tc-add" aria-label="Coach to assign" style="flex:1">${off.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><button class="btn small" data-act="assign-coach">Assign</button></div>`:''}</div>`;
}

async function practiceAct(a,ds){
  const d=ui.draft;
  switch(a){
    case 'new-practice':ui.draft={team:ui.team,day:today(),title:'',notes:'',items:[]};ui.pedit='new';ui.pq='';render();window.scrollTo(0,0);break;
    case 'edit-practice':{const p=S.practices.find(x=>x.id===ds.id);if(!p)return;ui.draft={id:p.id,team:p.team,day:p.day,title:p.title,notes:p.notes,items:p.items.map(i=>({...i}))};ui.pedit=p.id;ui.pq='';render();window.scrollTo(0,0);break;}
    case 'copy-practice':{const p=S.practices.find(x=>x.id===ds.id);if(!p)return;ui.draft={team:p.team,day:today(),title:p.title,notes:p.notes,items:p.items.map(i=>({...i}))};ui.pedit='new';ui.pq='';render();window.scrollTo(0,0);toast('Copied. Pick a date and save.');break;}
    case 'practice-cancel':ui.pedit=null;ui.draft=null;render();break;
    case 'pi-add':{syncDraft();const p=S.plans.find(x=>x.id===ds.id);if(!p||!d)return;d.items.push({plan_id:p.id,title:p.title,minutes:p.mins});render();toast('Added: '+p.title);break;}
    case 'pi-up':case 'pi-down':{syncDraft();const i=+ds.i,j=a==='pi-up'?i-1:i+1;if(!d||j<0||j>=d.items.length)return;[d.items[i],d.items[j]]=[d.items[j],d.items[i]];render();break;}
    case 'pi-remove':syncDraft();if(d){d.items.splice(+ds.i,1);render()}break;
    case 'practice-save':{syncDraft();if(!d)return;
      if(!d.team||!canEdit(d.team))return err('Pick a team you\u2019re assigned to.');
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d.day||''))return err('Pick a date.');
      if(!d.items.length)return err('Add at least one exercise.');
      if(busy)return;busy=true;
      try{const now=new Date().toISOString();
        const row={team_id:d.team,day:d.day,title:d.title||null,notes:d.notes||null,items:d.items,updated_by:S.session.uid,updated_at:now};
        const saved=d.id?chk(await sb.from('practices').update(row).eq('id',d.id).select().single()):chk(await sb.from('practices').insert({...row,created_by:S.session.uid}).select().single());
        const p=mapPractice(saved);S.practices=[p,...S.practices.filter(x=>x.id!==p.id)];
        ui.team=p.team;ui.practice=p.id;ui.pedit=null;ui.draft=null;render();window.scrollTo(0,0);toast('Practice saved');
      }finally{busy=false}break;}
    case 'practice-delete':{if(!confirm('Delete this practice? It will be removed from the team\u2019s history.'))return;
      chk(await sb.from('practices').delete().eq('id',ds.id));S.practices=S.practices.filter(x=>x.id!==ds.id);ui.pedit=null;ui.draft=null;ui.practice=null;render();toast('Practice deleted');break;}
    case 'open-practice':ui.practice=ds.id;ui.doneOpen=false;render();window.scrollTo(0,0);break;
    case 'practice-back':ui.practice=null;ui.doneOpen=false;render();break;
    case 'print-practice':window.print();break;
    case 'done-open':ui.doneOpen=true;render();break;
    case 'done-cancel':ui.doneOpen=false;render();break;
    case 'practice-done':{const notes=val('done-notes');
      const saved=chk(await sb.from('practices').update({status:'done',done_notes:notes||null,updated_by:S.session.uid,updated_at:new Date().toISOString()}).eq('id',ds.id).select().single());
      const p=mapPractice(saved);S.practices=S.practices.map(x=>x.id===p.id?p:x);ui.doneOpen=false;render();toast('Marked done and logged');break;}
    case 'open-plan-from-practice':ui.view='plans';ui.plan=ds.id;ui.edit=null;render();window.scrollTo(0,0);break;
    case 'assign-coach':{const c=val('tc-add');if(!c)return;chk(await sb.from('team_coaches').insert({team_id:ui.team,coach_id:c}));S.teamCoaches.push({team_id:ui.team,coach_id:c});render();toast(coachName(c)+' assigned to '+team(ui.team).name);break;}
    case 'unassign-coach':{chk(await sb.from('team_coaches').delete().match({team_id:ui.team,coach_id:ds.id}));S.teamCoaches=S.teamCoaches.filter(x=>!(x.team_id===ui.team&&x.coach_id===ds.id));render();break;}
  }
}

/* ===== Actions ===== */
let busy=false;
async function act(a,ds){
  const T=today();
  try{switch(a){
    case 'retry':if(sb){const {data}=await sb.auth.getSession();if(data&&data.session){loadingUid=null;await loadForUser(data.session.user)}else{BOOT.state='ready';render()}}else location.reload();break;
    case 'send-link':{const email=val('lemail').toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return err('Enter a valid email address.');
      if(busy)return;busy=true;err('Sending\u2026');
      try{const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});if(error)throw error;ui.linkSent=email;render()}
      catch(e){err(friendly(e))}finally{busy=false}break;}
    case 'link-again':ui.linkSent=null;render();break;
    case 'oauth':{const {error}=await sb.auth.signInWithOAuth({provider:ds.v,options:{redirectTo:location.origin+location.pathname}});if(error)err(friendly(error));break;}
    case 'logout':await sb.auth.signOut();resetState();BOOT.state='ready';render();break;
    case 'nav':ui.view=ds.v;ui.plan=null;ui.edit=null;ui.practice=null;ui.pedit=null;ui.draft=null;render();window.scrollTo(0,0);break;
    case 'board-scope':ui.boardScope=ds.v;render();break;
    case 'theme':ui.theme=ds.v;render();break;
    case 'band':ui.band=ds.v;render();break;
    case 'src':ui.src=ds.v;render();break;
    case 'open-plan':ui.plan=ds.id;render();window.scrollTo(0,0);break;
    case 'back':ui.plan=null;render();break;
    case 'new-plan':ui.edit='new';render();window.scrollTo(0,0);break;
    case 'edit-plan':ui.edit=ds.id;render();window.scrollTo(0,0);break;
    case 'cancel-edit':ui.edit=null;render();break;
    case 'team':ui.team=ds.v;render();break;

    /* guardian */
    case 'consent':{if(!document.getElementById('consent')?.checked)return err('Please tick the box to agree before continuing.');
      S.guardian=chk(await sb.from('guardians').insert({id:S.session.uid,consent_at:new Date().toISOString()}).select().single());render();break;}
    case 'add-child':{const name=cleanName(val('ch-name')),t=val('ch-team');
      if(!name)return err('Enter first name and last initial, like Mateo R.');if(!t)return err('Choose a team.');
      if(busy)return;busy=true;
      try{chk(await sb.from('players').insert({guardian_id:S.session.uid,team_id:t,requested_team_id:t,display_name:name}));clearJoin();
        await loadFamily();const n=S.children.at(-1);if(n)ui.child=n.id;ui.view='today';render();toast(name+' added. Waiting for coach approval.')}finally{busy=false}break;}
    case 'child':ui.child=ds.v;await loadBoard();render();break;
    case 'child-remove':{const c=S.children.find(c=>c.id===ds.id);if(!c||!confirm(`Remove ${c.name}? This deletes their training history and can\u2019t be undone.`))return;
      chk(await sb.from('players').delete().eq('id',c.id));if(ui.child===c.id)ui.child=null;await loadFamily();render();toast(c.name+' removed');break;}
    case 'toggle-drill':{if(busy)return;busy=true;
      try{const p=player(ui.child);const hw=S.homework[p.team]||[];
        const had=S.logs.some(l=>l.p===p.id&&l.d===ds.id&&l.date===T);
        if(had){chk(await sb.from('rep_logs').delete().match({player_id:p.id,drill_id:ds.id,day:T}));S.logs=S.logs.filter(l=>!(l.p===p.id&&l.d===ds.id&&l.date===T))}
        else{chk(await sb.from('rep_logs').upsert({player_id:p.id,drill_id:ds.id,day:T},{onConflict:'player_id,drill_id,day',ignoreDuplicates:true}));S.logs.push({p:p.id,d:ds.id,date:T})}
        const done=new Set(S.logs.filter(l=>l.p===p.id&&l.date===T).map(l=>l.d));
        const full=hw.length>0&&hw.every(h=>done.has(h.d));S.days[p.id]=S.days[p.id]||[];const dayHad=S.days[p.id].includes(T);
        if(full&&!dayHad){chk(await sb.from('complete_days').upsert({player_id:p.id,day:T},{onConflict:'player_id,day',ignoreDuplicates:true}));S.days[p.id].push(T)}
        if(!full&&dayHad){chk(await sb.from('complete_days').delete().match({player_id:p.id,day:T}));S.days[p.id]=S.days[p.id].filter(d=>d!==T)}
        await loadBoard();render();if(full&&!dayHad)toast(`All done! ${streak(p.id)} day streak`);
      }finally{busy=false}break;}

    /* coach */
    case 'load-starter':{if(busy)return;busy=true;err('Loading\u2026');
      try{if(!S.drills.length)chk(await sb.from('drills').insert(STARTER.drills.map(d=>({name:d.name,how:d.how,default_target:d.target}))));
        if(!S.plans.length)chk(await sb.from('plans').insert(STARTER.plans.map(p=>({...planRow(p),created_by:S.session.uid}))));
        S.drills=(await all(()=>sb.from('drills').select('*').order('name'))).map(mapDrill);await loadCoachData();render();toast('Library loaded: '+S.plans.length+' sessions')}
      catch(e){err(friendly(e))}finally{busy=false}break;}
    case 'save-plan':{
      const title=val('pf-title');if(!title)return err('Add a title to save the plan.');
      const bands=BANDS.filter(b=>document.getElementById('pf-b-'+b)?.checked);if(!bands.length)return err('Pick at least one age group.');
      const old=ui.edit==='new'?{}:S.plans.find(x=>x.id===ui.edit)||{};
      const data={...old,title,theme:val('pf-theme'),bands,mins:parseInt(val('pf-mins'))||60,objective:val('pf-objective'),setup:val('pf-setup'),warmup:val('pf-warmup'),main:val('pf-main'),game:val('pf-game'),points:val('pf-points').split('\n').map(s=>s.trim()).filter(Boolean),progress:val('pf-progress'),link:val('pf-link')};
      if(busy)return;busy=true;
      try{const row={...planRow(data),updated_at:new Date().toISOString()};
        const saved=ui.edit==='new'?chk(await sb.from('plans').insert({...row,created_by:S.session.uid}).select().single()):chk(await sb.from('plans').update(row).eq('id',ui.edit).select().single());
        const p=mapPlan(saved);S.plans=[p,...S.plans.filter(x=>x.id!==p.id)];ui.plan=p.id;ui.edit=null;render();toast('Plan saved')}finally{busy=false}break;}
    case 'delete-plan':if(confirm('Delete this plan for all coaches?')){chk(await sb.from('plans').delete().eq('id',ds.id));S.plans=S.plans.filter(p=>p.id!==ds.id);ui.plan=null;render();toast('Plan deleted')}break;
    case 'hw-add':{const id=val('hw-add');const d=drill(id);if(!d)return;const list=S.homework[ui.team]||[];
      chk(await sb.from('homework').insert({team_id:ui.team,drill_id:id,target:d.target,position:list.length}));
      (S.homework[ui.team]=list).push({d:id,target:d.target,pos:list.length});render();toast('Added to daily reps');break;}
    case 'hw-remove':{const h=(S.homework[ui.team]||[])[+ds.i];if(!h)return;
      chk(await sb.from('homework').delete().match({team_id:ui.team,drill_id:h.d}));S.homework[ui.team].splice(+ds.i,1);render();break;}
    case 'drill-new':ui.addingDrill=true;render();break;
    case 'drill-cancel':ui.addingDrill=false;render();break;
    case 'drill-save':{const name=val('nd-name');if(!name)return err('Give the drill a name.');
      const r=chk(await sb.from('drills').insert({name,how:val('nd-how'),default_target:val('nd-target')||'Coach sets target',video_url:val('nd-video')||null}).select().single());
      S.drills.push(mapDrill(r));ui.addingDrill=false;render();toast('Drill saved to the bank');break;}
    case 'approve':{const p=S.pending.find(x=>x.id===ds.id);if(!p)return;const t=val('ap-'+p.id)||p.req;
      chk(await sb.from('players').update({status:'active',team_id:t,approved_by:S.session.uid,approved_at:new Date().toISOString()}).eq('id',p.id));
      S.pending=S.pending.filter(x=>x.id!==p.id);S.players.push({...p,team:t,status:'active'});render();toast(p.name+' approved for '+team(t).name);break;}
    case 'decline':{const p=S.pending.find(x=>x.id===ds.id);if(!p||!confirm(`Decline ${p.name}? The request will be deleted.`))return;
      chk(await sb.from('players').delete().eq('id',p.id));S.pending=S.pending.filter(x=>x.id!==p.id);render();toast('Request declined');break;}
    case 'player-remove':{const p=player(ds.id);if(!p||!confirm(`Remove ${p.name} and their history?`))return;
      chk(await sb.from('players').delete().eq('id',p.id));S.players=S.players.filter(x=>x.id!==p.id);render();toast(p.name+' removed');break;}
    case 'copy-link':{const v=val('joinlink');try{await navigator.clipboard.writeText(v);toast('Join link copied')}catch(e){document.getElementById('joinlink')?.select();toast('Select the link and copy it')}break;}
    case 'invite':{const name=val('inv-name'),email=val('inv-email').toLowerCase();
      if(!name)return err('Add the coach\u2019s name.','err-inv');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return err('Enter a valid email.','err-inv');
      chk(await sb.from('coach_invites').insert({email,name,is_approver:false}));S.invites.push({email,name,is_approver:false});render();toast(name+' invited. They\u2019re a coach once they sign in.');break;}
    default:await practiceAct(a,ds);break;
    case 'invite-remove':chk(await sb.from('coach_invites').delete().eq('email',ds.email));S.invites=S.invites.filter(i=>i.email!==ds.email);render();break;
  }}catch(e){console.error(e);toast(friendly(e))}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el){e.preventDefault();act(el.dataset.act,el.dataset)}});
document.addEventListener('change',async e=>{const el=e.target;
  if(el.dataset.change==='hw-target'){const h=S.homework[ui.team][+el.dataset.i];const v=el.value.trim();
    try{chk(await sb.from('homework').update({target:v}).match({team_id:ui.team,drill_id:h.d}));h.target=v;toast('Target updated')}catch(x){toast(friendly(x))}}});
document.addEventListener('input',e=>{if(e.target.id==='pq'){ui.pq=e.target.value;const el=document.getElementById('picker');if(el)el.innerHTML=pickList(pickCands());return}if(e.target.id==='q'){ui.q=e.target.value;document.getElementById('planlist').innerHTML=planList(filterPlans())}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lemail')act('send-link',{})});
render();boot();

</script>
</body>
